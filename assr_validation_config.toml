[paths]
dataset_root = "data/external/ds006780"
output_root = "outputs/assr_validation"
export_root = "results/assr_validation"

[dataset]
dataset_id = "ds006780"
dataset_version = "1.0.0"
group = "TD"
task = "ASSR"

[analysis]
seed = 20260827
workers = 1
sampling_rate = 512
frequencies_hz = [40.0, 27.0]
primary_frequency_hz = 40.0
trials_per_block = 10
standards_per_frequency = [170, 160]
k_values = [2, 3, 4, 5, 6, 7, 8, 9, 10]
surrogates_per_block = 1000
epoch_start_seconds = 0.05
epoch_end_seconds = 0.45

[preprocessing]
l_freq = 1.0
h_freq = 100.0
notch_hz = 60.0
average_reference = true
artifact_peak_to_peak_uv = 250.0
minimum_clean_trials = 100

[estimators]
hilbert_order = 4
hilbert_half_bandwidth_hz = 4.0

[validation]
target_fpr = 0.05
fpr_acceptance_high = 0.055
minimum_participants = 35
bootstrap_iterations = 10000
sign_flip_iterations = 100000

[runtime]
minimum_progress_interval_seconds = 0.25
minimum_free_disk_gb = 10.0
