[paths]
data_root = "data"
baseline_advanced_run = "outputs/advanced_study/8bf2fe56f4b9"
output_root = "outputs/confirmatory_study"
export_root = "results/confirmatory_study"

[analysis]
seed = 20260826
workers = 1
sampling_rate = 1000
onset_crop_samples = 500
trials_per_stream = 10
streams_per_condition = 3
conditions = 15
channels = 32
harmonics_hz = [4.0, 8.0, 12.0, 16.0]
k_values = [2, 3, 4, 5, 6, 7, 8, 9, 10]
primary_duration_seconds = 4.5
surrogate_seeds = [20260826, 20260827]
surrogates_per_seed = 100

[windows]
matched_window_start_seconds = 0.5
matched_window_end_seconds = 4.5
full_window_start_seconds = 0.5
full_window_end_seconds = 5.0

[hilbert]
order = 4
half_bandwidth_hz = 0.5
edge_crop_seconds = 0.5

[calibration]
target_fpr = 0.05
fpr_acceptance_low = 0.045
fpr_acceptance_high = 0.055

[machine_learning]
c_grid = [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
locked_c = 100.0
maximum_iterations = 150
tolerance = 1e-8

[trca]
regularization_grid = [0.1]

[spatial]
regions = [
  ["Fp1", "Fp2", "F7", "F3", "Fz", "F4", "F8"],
  ["FC5", "FC1", "FC2", "FC6"],
  ["T7", "C3", "Cz", "C4", "T8"],
  ["TP9", "CP5", "CP1", "CP2", "CP6", "TP10"],
  ["P7", "P3", "Pz", "P4", "P8", "PO9", "O1", "Oz", "O2", "PO10"],
]
region_names = ["frontal", "frontocentral", "central_temporal", "centroparietal", "posterior"]

[statistics]
bootstrap_iterations = 5000
sign_flip_iterations = 10000

[runtime]
minimum_progress_interval_seconds = 0.25
minimum_free_disk_gb = 4.0
