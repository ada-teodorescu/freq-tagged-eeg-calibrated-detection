[project]
name = "freq-tagged-eeg-calibrated-detection"
version = "0.1.0"
description = "Analysis code for calibrated detection of frequency-tagged auditory EEG"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.11",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "rich>=13.9",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
raw = [
  "mne>=1.8,<2",
  "mne-icalabel>=0.7,<1",
  "onnxruntime>=1.18,<2",
]

[project.scripts]
eeg-replication = "eeg_replication.cli:main"
eeg-detection = "eeg_detection.cli:main"
eeg-improvement = "eeg_improvement.cli:main"
eeg-raw-replication = "eeg_raw_replication.cli:main"
eeg-algorithm-study = "eeg_algorithm_study.cli:main"
eeg-accuracy-study = "eeg_accuracy_study.cli:main"
eeg-advanced-study = "eeg_advanced_study.cli:main"
eeg-confirmatory-study = "eeg_confirmatory_study.cli:main"
eeg-external-validation = "eeg_external_validation.cli:main"
eeg-validation-extension = "eeg_validation_extension.cli:main"
eeg-assr-validation = "eeg_assr_validation.cli:main"
eeg-support-study = "eeg_support_study.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/eeg_replication", "src/eeg_detection", "src/eeg_improvement",
  "src/eeg_raw_replication", "src/eeg_core", "src/eeg_algorithm_study",
  "src/eeg_accuracy_study", "src/eeg_advanced_study",
  "src/eeg_confirmatory_study", "src/eeg_external_validation",
  "src/eeg_validation_extension", "src/eeg_assr_validation",
  "src/eeg_support_study", "src/eeg_exposure_study",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
cache_dir = ".pytest_cache"
